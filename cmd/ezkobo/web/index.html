<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>EzKobo</title>
<style>
  /* Mirrors the iPhone app: iOS grouped-list colours and type. */
  :root {
    --bg: #f2f2f7;
    --cell: #ffffff;
    --label: #000000;
    --secondary: rgba(60, 60, 67, 0.6);
    --separator: rgba(60, 60, 67, 0.18);
    --fill: rgba(118, 118, 128, 0.12);
    --tint: #007aff;
    --green: #34c759;
    --orange: #ff9500;
    --red: #ff3b30;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --cell: #1c1c1e;
      --label: #ffffff;
      --secondary: rgba(235, 235, 245, 0.6);
      --separator: rgba(84, 84, 88, 0.6);
      --fill: rgba(118, 118, 128, 0.24);
      --tint: #0a84ff;
      --green: #30d158;
      --orange: #ff9f0a;
      --red: #ff453a;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--label);
    font: 17px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 600px;
    margin: 0 auto;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom));
  }
  h1 { font-size: 34px; font-weight: 700; letter-spacing: 0.01em; margin: 8px 4px 12px; }

  .search {
    display: flex; align-items: center; gap: 8px;
    background: var(--fill); border-radius: 22px; height: 44px; padding: 0 14px;
  }
  .search svg { flex: none; color: var(--secondary); }
  .search input {
    flex: 1; min-width: 0; border: 0; background: none; outline: none;
    font: inherit; color: var(--label);
  }
  .search input::placeholder { color: var(--secondary); }

  .section-header {
    color: var(--secondary); font-size: 17px; font-weight: 600;
    margin: 28px 20px 8px;
  }
  .section-footer { color: var(--secondary); font-size: 13px; margin: 8px 20px 0; }
  .group { background: var(--cell); border-radius: 26px; overflow: hidden; }
  .row {
    position: relative; display: flex; align-items: center; gap: 14px;
    min-height: 52px; padding: 12px 20px;
  }
  .row + .row::before {
    content: ""; position: absolute; top: 0; right: 20px; left: var(--inset, 20px);
    border-top: 0.5px solid var(--separator);
  }
  .grow { flex: 1; min-width: 0; }
  .subtitle { color: var(--secondary); font-size: 15px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .muted { color: var(--secondary); }
  .title2 {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; word-break: break-word;
  }
  .one-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .serial { font: 13px ui-monospace, "SF Mono", Menlo, monospace; color: var(--secondary); margin-left: 6px; }
  .stats { display: flex; gap: 10px; align-items: center; color: var(--secondary); font-size: 15px; margin-top: 3px; white-space: nowrap; }
  .battery { display: inline-flex; align-items: center; gap: 4px; }
  .glyph { flex: none; width: 34px; display: flex; justify-content: center; color: var(--secondary); }

  .delete {
    flex: none; border: 0; background: none; padding: 8px; margin: -8px -8px -8px 0;
    color: var(--secondary); border-radius: 50%; cursor: pointer;
  }
  .delete:hover { color: var(--red); }

  .progress { height: 4px; border-radius: 2px; background: var(--fill); margin-top: 8px; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: var(--tint); transition: width .15s; }
  .status { flex: none; color: var(--secondary); font-variant-numeric: tabular-nums; }
  .ok { color: var(--green); }
  .bad { color: var(--orange); }

  .warn { color: var(--orange); font-size: 15px; margin-top: 3px; }
  .note { color: var(--secondary); font-size: 13px; margin-top: 3px; }
  .lock { color: var(--secondary); margin-left: 6px; vertical-align: -1px; }
  .pin-row input {
    flex: 1; min-width: 0; border: 0; background: none; outline: none;
    font: inherit; color: var(--label); letter-spacing: 0.2em;
  }
  .pin-row button {
    border: 0; background: none; color: var(--tint); font: inherit; font-weight: 600; cursor: pointer;
  }
  .cover { flex: none; width: 44px; height: 66px; border-radius: 3px; object-fit: cover; background: var(--fill); }
  .cover.big { width: 90px; height: 135px; border-radius: 6px; }
  .bar { height: 4px; border-radius: 2px; background: var(--fill); margin: 6px 0 4px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--tint); }
  .tap { cursor: pointer; }
  .chev { color: var(--secondary); flex: none; }
  .value { color: var(--secondary); white-space: nowrap; }
  dialog {
    border: 0; padding: 0; width: min(560px, 100vw); max-height: 92vh; border-radius: 26px 26px 0 0;
    margin: auto auto 0; background: var(--bg); color: var(--label);
  }
  @media (min-width: 640px) { dialog { border-radius: 26px; margin: auto; } }
  dialog::backdrop { background: rgba(0, 0, 0, 0.35); }
  .sheet { padding: 16px 16px 32px; overflow-y: auto; max-height: 92vh; }
  .sheet-bar { display: flex; justify-content: flex-end; }
  .sheet-bar button { border: 0; background: none; color: var(--tint); font: inherit; font-weight: 600; padding: 8px; cursor: pointer; }
  .quote { border-left: 3px solid #ffcc00; padding-left: 10px; }
  .desc { white-space: pre-line; }
  .empty { text-align: center; padding: 120px 24px 0; }
  .empty h2 { font-size: 22px; margin: 16px 0 8px; }
  .empty p { color: var(--secondary); margin: 0; }

  .send {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(24px + env(safe-area-inset-bottom));
    border: 0; border-radius: 999px; padding: 15px 30px; max-width: calc(100% - 48px);
    background: var(--tint); color: #fff; font: inherit; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
  }
  .send:disabled { opacity: 0.5; cursor: default; }
  body.dragging .send { outline: 3px solid var(--tint); outline-offset: 4px; }
  input[type=file] { display: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>EzKobo</h1>

  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5 5"/></svg>
    <input id="query" type="search" placeholder="Search Books" autocomplete="off" aria-label="Search books">
  </label>

  <section id="sending" hidden>
    <div class="section-header" id="sendingTitle">Sending</div>
    <div class="group" id="queue"></div>
    <div class="section-footer" id="sendingNote" hidden></div>
  </section>

  <section id="pinSection" hidden>
    <div class="section-header">PIN</div>
    <form class="group" id="pinForm"><div class="row pin-row">
      <input id="pin" type="password" inputmode="numeric" autocomplete="one-time-code" placeholder="Enter PIN" aria-label="PIN">
      <button type="submit">Unlock</button>
    </div></form>
    <div class="section-footer" id="pinNote">This Kobo has a PIN. You can see it under EzKobo status in the Kobo’s menu.</div>
  </section>

  <section id="koboSection" hidden>
    <div class="section-header">Kobo</div>
    <div class="group"><div class="row" id="kobo"></div></div>
  </section>

  <section id="readingSection" hidden>
    <div class="section-header" id="readingTitle">Reading Now</div>
    <div class="group" id="reading"></div>
  </section>

  <section id="statsSection" hidden>
    <div class="section-header">Reading Stats</div>
    <div class="group" id="stats"></div>
  </section>

  <section id="librarySection" hidden>
    <div class="section-header" id="libraryTitle">On Kobo</div>
    <div class="group" id="books"></div>
  </section>

  <div class="empty" id="offline" hidden>
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" class="muted" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.6a10 10 0 0 1 14 0M8.5 16.3a5 5 0 0 1 7 0"/><circle cx="12" cy="20" r="1" fill="currentColor"/></svg>
    <h2>Can’t Reach Your Kobo</h2>
    <p>Make sure it’s awake with Wi‑Fi on, then reload this page.</p>
  </div>
</main>

<button class="send" id="send" hidden>Send Books</button>
<dialog id="bookSheet"><div class="sheet">
  <div class="sheet-bar"><button id="closeSheet">Done</button></div>
  <div id="bookBody" tabindex="-1" autofocus style="outline: none"></div>
</div></dialog>
<input type="file" id="file" multiple>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const IMPORT_HINT = 'On your Kobo, open the menu and tap Import new books to add them to your library.';

let info = null;
let books = [];
let summary = null;

// The PIN, if this Kobo has one, is remembered in this browser.
const PIN_KEY = 'ezkobo-pin';
const storedPIN = () => { try { return localStorage.getItem(PIN_KEY) || ''; } catch (_) { return ''; } };
const pinHeaders = () => (storedPIN() ? { 'X-EzKobo-PIN': storedPIN() } : {});
function api(path, opts = {}) {
  return fetch(path, { ...opts, headers: { ...(opts.headers || {}), ...pinHeaders() } });
}

// Same formatting as the app: "Books/Dune.kepub.epub" → "Dune", "KEPUB".
function bookTitle(name) {
  const file = name.split('/').pop();
  return file.toLowerCase().endsWith('.kepub.epub') ? file.slice(0, -11) : file.replace(/\.[^.]+$/, '');
}
function bookFormat(name) {
  return name.toLowerCase().endsWith('.kepub.epub') ? 'KEPUB' : (name.split('.').pop() || '').toUpperCase();
}
function size(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(2).replace(/\.?0+$/, '') + ' GB';
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + ' MB';
  return Math.max(1, Math.round(n / 1e3)) + ' KB';
}
function hours(sec) {
  if (!sec || sec < 60) return 'Under a minute';
  const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  return h ? `${h} hr${h > 1 ? 's' : ''}${m ? `, ${m} min` : ''}` : `${m} min`;
}
function when(iso) {
  const d = iso ? new Date(iso) : null;
  return d && !isNaN(d) ? d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '';
}
const coverURL = (id) => '/api/cover?id=' + encodeURIComponent(id) + (storedPIN() ? '&pin=' + encodeURIComponent(storedPIN()) : '');
const coverImg = (b, big) => b.cover ? `<img class="cover${big ? ' big' : ''}" src="${esc(coverURL(b.id))}" alt="">` : `<div class="cover${big ? ' big' : ''}"></div>`;
const chevron = '<svg class="chev" width="8" height="14" viewBox="0 0 8 14" aria-hidden="true"><path d="m1 1 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function renderReading() {
  if (!summary) { $('readingSection').hidden = $('statsSection').hidden = true; return; }
  const r = summary.reading;
  $('readingSection').hidden = r.length === 0;
  $('reading').innerHTML = r.map((b) => `
    <div class="row tap" data-book="${esc(b.id)}">
      ${coverImg(b)}
      <div class="grow">
        <div class="title2">${esc(b.title)}</div>
        ${b.author ? `<div class="subtitle">${esc(b.author)}</div>` : ''}
        <div class="bar"><div style="width:${b.progress}%"></div></div>
        <div class="note">${[b.progress + '%', b.secondsLeft ? hours(b.secondsLeft) + ' left' : ''].filter(Boolean).join(' · ')}</div>
      </div>${chevron}
    </div>`).join('');
  const st = summary.stats;
  $('statsSection').hidden = false;
  $('stats').innerHTML = [['Time reading', hours(st.secondsRead)], ['Finished', st.finished], ['Reading', st.reading], ['Not started', st.notStarted]]
    .map(([k, v]) => `<div class="row"><div class="grow">${k}</div><span class="value">${v}</span></div>`).join('')
    + summary.byTime.slice(0, 5).map((b) => `
    <div class="row tap" data-book="${esc(b.id)}" style="--inset: 78px">
      ${coverImg(b)}
      <div class="grow"><div class="one-line">${esc(b.title)}</div>${b.author ? `<div class="subtitle">${esc(b.author)}</div>` : ''}</div>
      <span class="value">${hours(b.secondsRead)}</span>${chevron}
    </div>`).join('');
}

async function openBook(id) {
  $('bookBody').innerHTML = '<p class="muted">Loading…</p>';
  $('bookSheet').showModal();
  try {
    const res = await api('/api/book?id=' + encodeURIComponent(id));
    if (!res.ok) throw new Error();
    const { book: b, highlights } = await res.json();
    const series = b.series ? b.series + (b.seriesNumber ? ' #' + b.seriesNumber : '') : '';
    const facts = [['Time reading', b.secondsRead ? hours(b.secondsRead) : ''], ['Time left', b.secondsLeft ? hours(b.secondsLeft) : ''],
      ['Last read', when(b.lastRead)], ['Finished', when(b.finished)], ['Pages', b.pages || ''], ['Publisher', b.publisher || ''], ['ISBN', b.isbn || '']]
      .filter(([, v]) => v);
    $('bookBody').innerHTML = `
      <div style="display:flex; gap:16px; align-items:flex-start; margin: 4px 4px 8px">
        ${coverImg(b, true)}
        <div><h2 style="margin:0 0 6px; font-size:22px">${esc(b.title)}</h2>
          ${b.author ? `<div class="muted">${esc(b.author)}</div>` : ''}${series ? `<div class="subtitle">${esc(series)}</div>` : ''}</div>
      </div>
      <div class="section-header">Reading</div>
      <div class="group">
        <div class="row"><div class="grow"><div class="bar"><div style="width:${b.progress}%"></div></div>
          <div class="note">${b.status === 2 ? 'Finished' : b.status === 0 ? 'Not started' : b.progress + '% read'}</div></div></div>
        ${facts.map(([k, v]) => `<div class="row"><div class="grow">${k}</div><span class="value">${esc(String(v))}</span></div>`).join('')}
      </div>
      ${b.description ? `<div class="section-header">About</div><div class="group"><div class="row desc">${esc(b.description)}</div></div>` : ''}
      <div class="section-header">${highlights.length ? `Highlights (${highlights.length})` : 'Highlights'}</div>
      <div class="group">${highlights.length ? highlights.map((h) => `
        <div class="row"><div class="grow">
          ${h.text ? `<div class="quote">${esc(h.text)}</div>` : ''}
          ${h.note ? `<div class="note" style="margin-top:6px">Note: ${esc(h.note)}</div>` : ''}
        </div></div>`).join('') : '<div class="row muted">Highlights and notes you make on the Kobo appear here.</div>'}</div>`;
  } catch (_) {
    $('bookBody').innerHTML = '<p class="muted">Couldn’t load this book.</p>';
  }
}
$('closeSheet').addEventListener('click', () => $('bookSheet').close());
document.addEventListener('click', (e) => {
  const row = e.target.closest('[data-book]');
  if (row && !e.target.closest('.delete')) openBook(row.dataset.book);
});

function deviceGlyph(model) {
  const buttons = /libra|forma|sage/i.test(model);
  const w = buttons ? 31 : 27;
  return `<svg width="${w}" height="38" viewBox="0 0 ${w} 38" fill="none" aria-hidden="true">
    <rect x="0.75" y="0.75" width="${w - 1.5}" height="36.5" rx="5" stroke="currentColor" stroke-width="1.5"/>
    <rect x="4" y="4.5" width="${w - (buttons ? 13 : 8)}" height="29" rx="1.5" fill="currentColor" opacity="0.25"/>
    ${buttons ? `<rect x="${w - 6}" y="14" width="1.5" height="5" rx=".75" fill="currentColor"/><rect x="${w - 6}" y="21" width="1.5" height="5" rx=".75" fill="currentColor"/>` : ''}
  </svg>`;
}
function batteryIcon(level, charging) {
  const fill = Math.max(1, Math.round(level / 100 * 15));
  return `<svg width="25" height="12" viewBox="0 0 25 12" aria-hidden="true">
    <rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="currentColor" opacity=".45"/>
    <rect x="22.5" y="4" width="1.8" height="4" rx=".9" fill="currentColor" opacity=".45"/>
    <rect x="2.5" y="2.5" width="${fill}" height="7" rx="1.5" fill="${charging ? 'var(--green)' : 'currentColor'}"/>
  </svg>`;
}

function renderKobo() {
  const b = info.battery;
  $('kobo').innerHTML = `
    <div class="glyph">${deviceGlyph(info.model)}</div>
    <div class="grow">
      <div class="one-line">${esc(info.model)}${info.serial ? `<span class="serial">${esc(info.serial)}</span>` : ''}${info.locked ? '<svg class="lock" width="12" height="14" viewBox="0 0 12 14" aria-label="PIN protected"><rect x="1" y="6" width="10" height="7.5" rx="1.5" fill="currentColor"/><path d="M3.2 6V4.2a2.8 2.8 0 0 1 5.6 0V6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>' : ''}</div>
      <div class="stats">
        ${b ? `<span class="battery">${batteryIcon(b.level, b.charging)} ${b.level}%</span>` : ''}
        <span>${size(info.free)} free</span>
        <span>${info.books === 1 ? '1 book' : info.books + ' books'}</span>
      </div>
    </div>`;
  $('libraryTitle').textContent = 'On ' + info.model;
  $('send').textContent = 'Send to ' + info.model;
  $('koboSection').hidden = $('librarySection').hidden = $('send').hidden = false;
  $('offline').hidden = true;
}

function renderBooks() {
  const q = $('query').value.trim().toLowerCase();
  const shown = q ? books.filter((b) => ((b.title || b.name) + ' ' + (b.author || '')).toLowerCase().includes(q)) : books;
  const el = $('books');
  if (!books.length) {
    el.innerHTML = '<div class="row muted">Books you send will appear here.</div>';
  } else if (!shown.length) {
    el.innerHTML = `<div class="row muted">No books match “${esc($('query').value)}”.</div>`;
  } else {
    el.innerHTML = shown.map((b) => `
      <div class="row${b.inLibrary ? ' tap' : ''}"${b.inLibrary ? ` data-book="${esc(b.id)}"` : ''}>
        <div class="grow">
          <div class="title2">${esc(b.title || bookTitle(b.name))}</div>
          <div class="subtitle">${[b.author ? esc(b.author) : '', bookFormat(b.name), b.progress ? b.progress + '% read' : size(b.size)].filter(Boolean).join(' · ')}</div>
          ${b.inLibrary === false ? '<div class="warn">Not in library yet</div>' : ''}
        </div>
        <button class="delete" data-name="${esc(b.name)}" aria-label="Delete ${esc(bookTitle(b.name))}" title="Delete from Kobo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M5.5 7l1 12a2 2 0 0 0 2 1.8h7a2 2 0 0 0 2-1.8l1-12M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </button>
      </div>`).join('');
  }
}

async function refresh() {
  try {
    const [i, l] = await Promise.all([fetch('/api/info'), api('/api/books')]);
    info = await i.json();
    renderKobo();
    if (l.status === 401 || l.status === 429) {
      books = [];
      $('pinSection').hidden = false;
      $('librarySection').hidden = $('send').hidden = true;
      $('pinNote').textContent = l.status === 429 ? 'Too many wrong PINs. Wait 30 seconds and try again.'
        : storedPIN() ? 'That PIN isn’t right.' : 'This Kobo has a PIN. You can see it under EzKobo status in the Kobo’s menu.';
      return;
    }
    $('pinSection').hidden = true;
    books = (await l.json()).books;
    renderBooks();
    try {
      const rr = await api('/api/reading');
      summary = rr.ok ? await rr.json() : null;
    } catch (_) { summary = null; }
    renderReading();
  } catch (e) {
    $('offline').hidden = false;
    $('koboSection').hidden = $('librarySection').hidden = $('send').hidden = true;
  }
}

$('query').addEventListener('input', renderBooks);

$('pinForm').addEventListener('submit', (e) => {
  e.preventDefault();
  try { localStorage.setItem(PIN_KEY, $('pin').value.trim()); } catch (_) {}
  $('pin').value = '';
  refresh();
});

$('books').addEventListener('click', async (e) => {
  const btn = e.target.closest('.delete');
  if (!btn) return;
  const name = btn.dataset.name;
  if (!confirm(`Delete “${bookTitle(name)}” from your Kobo?`)) return;
  await api('/api/books/' + encodeURIComponent(name), { method: 'DELETE' });
  await api('/api/rescan', { method: 'POST' });
  refresh();
});

function upload(file, row) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open('PUT', '/api/books/' + encodeURIComponent(file.name));
    for (const [k, v] of Object.entries(pinHeaders())) x.setRequestHeader(k, v);
    x.upload.onprogress = (e) => {
      if (!e.lengthComputable) return;
      const pct = Math.round(e.loaded / e.total * 100);
      row.querySelector('.progress > div').style.width = pct + '%';
      // At 100% the Kobo is converting or looking up details.
      row.querySelector('.status').textContent = pct < 100 ? pct + '%' : 'Processing';
    };
    x.onload = () => {
      let d = {};
      try { d = JSON.parse(x.responseText); } catch (_) {}
      x.status < 300 ? resolve(d) : reject(new Error(d.error || 'HTTP ' + x.status));
    };
    x.onerror = () => reject(new Error('Connection lost'));
    x.send(file);
  });
}

let batch = 0;
async function sendAll(files) {
  if (!files.length || !info) return;
  const id = ++batch;
  $('send').disabled = true;
  $('sending').hidden = false;
  $('sendingTitle').textContent = 'Sending';
  $('sendingNote').hidden = true;
  const queue = $('queue');
  queue.innerHTML = '';
  const rows = files.map((f) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<div class="grow"><div class="one-line">${esc(bookTitle(f.name))}</div><div class="progress"><div></div></div></div><span class="status">Waiting</span>`;
    queue.appendChild(row);
    return row;
  });

  let sent = 0, failed = 0;
  for (let i = 0; i < files.length; i++) {
    const row = rows[i];
    try {
      const d = await upload(files[i], row);
      row.querySelector('.progress').remove();
      const status = row.querySelector('.status');
      const notes = [d.converted ? 'Converted to KEPUB' : '',
        { openlibrary: 'Details from Open Library', google: 'Details from Google Books', cleaned: 'Name cleaned up' }[d.metadata] || ''].filter(Boolean);
      if (d.name) row.querySelector('.one-line').textContent = bookTitle(d.name);
      if (notes.length) row.querySelector('.grow').insertAdjacentHTML('beforeend', `<div class="note">${notes.join(' · ')}</div>`);
      if (d.skipped) { status.textContent = 'Already on Kobo'; }
      else { status.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" class="ok" aria-label="Sent"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="m7 12.5 3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'; sent++; }
    } catch (e) {
      failed++;
      row.querySelector('.progress').remove();
      row.querySelector('.status').innerHTML = '<span class="bad">⚠︎</span>';
      row.querySelector('.grow').insertAdjacentHTML('beforeend', `<div class="subtitle">${esc(e.message)}</div>`);
    }
  }

  $('sendingTitle').textContent = failed ? 'Couldn’t Send' : 'Sent';
  if (sent) {
    let imported = false;
    try { imported = (await (await api('/api/rescan', { method: 'POST' })).json()).ok; } catch (_) {}
    $('sendingNote').textContent = imported ? 'Your Kobo is adding them to its library.' : IMPORT_HINT;
    $('sendingNote').hidden = false;
  }
  $('send').disabled = false;
  await refresh();

  // Like the app: a successful send is confirmed briefly, failures stay.
  if (!failed) {
    setTimeout(() => { if (batch === id) $('sending').hidden = true; }, sent ? 6000 : 3000);
  }
}

$('send').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', (e) => { sendAll([...e.target.files]); e.target.value = ''; });
document.addEventListener('dragover', (e) => { e.preventDefault(); document.body.classList.add('dragging'); });
document.addEventListener('dragleave', (e) => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
document.addEventListener('drop', (e) => { e.preventDefault(); document.body.classList.remove('dragging'); sendAll([...e.dataTransfer.files]); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

refresh();
</script>
</body>
</html>
